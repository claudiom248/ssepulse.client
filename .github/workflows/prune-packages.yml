name: prune-packages

on:
  workflow_run:
    workflows: [ ci ]
    types: [ completed ]
    branches: [ master ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list the versions that would be deleted'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: prune-packages
  cancel-in-progress: false

jobs:
  prune:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prune preview packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.scripts/prune-packages.ps1 -KeepPreviews 10 -KeepStable 1 ${{ inputs.dry_run && '-DryRun' || '' }}
        shell: pwsh
