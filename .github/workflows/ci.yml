name: ci

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        tfm: [ net8.0, net10.0 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x
            10.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Build and test
        run: ./.scripts/build-and-test.ps1 -Configuration Release -RunTests -Framework ${{ matrix.tfm }} -TestResultsDirectory .artifacts/test-results/${{ matrix.os }}/${{ matrix.tfm }}
        shell: pwsh

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: (success() || failure())
        with:
          name: .NET Tests - ${{ matrix.os }} - ${{ matrix.tfm }}
          path: '.artifacts/test-results/${{ matrix.os }}/${{ matrix.tfm }}/**/*.trx'
          reporter: dotnet-trx
          fail-on-error: 'false'

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: logs-${{ matrix.os }}-${{ matrix.tfm }}
          path: |
            msbuild.binlog
            .artifacts/test-results/${{ matrix.os }}/${{ matrix.tfm }}/**/*.trx

  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Pack
        run: ./.scripts/pack.ps1 -Configuration Release
        shell: pwsh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: .artifacts/nuget/Release/*.nupkg
          if-no-files-found: error

      - name: Push preview packages to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          $feed = "https://nuget.pkg.github.com/$env:GITHUB_OWNER/index.json"
          foreach ($package in Get-ChildItem -Path ".artifacts/nuget/Release" -Filter "*.nupkg") {
              dotnet nuget push $package.FullName --source $feed --api-key $env:GITHUB_TOKEN --skip-duplicate
          }
        shell: pwsh
